[project]
name = "mail-radar"
version = "0.3.0"
description = "Analizza una casella IMAP leggendo solo gli header: insight, dashboard locale e pulizia con regole."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luca Paganin" }]
dependencies = [
    "imapclient>=3.0",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]

[project.scripts]
mail-radar = "mail_radar.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_radar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM102", "SIM103", "SIM115", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
